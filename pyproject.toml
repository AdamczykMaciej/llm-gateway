[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-gateway"
version = "0.1.0"
description = "Self-hosted multi-provider LLM gateway: fallback chain, circuit breaker, PII-masked tracing — as a library or an OpenAI-compatible HTTP service."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Maciej Adamczyk" }]
dependencies = [
  "anthropic>=0.41.0,<1",
  "openai>=1.58.1,<2",
  "httpx>=0.27,<1.0",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[project.optional-dependencies]
service = ["fastapi>=0.110,<1.0", "uvicorn[standard]>=0.27,<1.0"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
]

[project.scripts]
llm-gateway = "llm_gateway.service.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
