[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-gateway"
version = "0.42.2"
description = "Self-hosted multi-provider LLM gateway (Anthropic, Claude and Gemini on Google Vertex AI, Azure AI Foundry, Hugging Face, Groq, OpenAI, Mistral, OpenRouter, and any OpenAI-compatible host): fallback chain, circuit breaker, PII-masked tracing — as a library or an OpenAI-compatible HTTP service."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Maciej Adamczyk" }]
dependencies = [
  "anthropic>=1.5.0,<2",
  "openai>=3.13.0,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "typing-extensions>=4.12,<5",
  "opentelemetry-sdk>=1.45.1,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2",
]

[project.optional-dependencies]
service = ["fastapi>=0.133,<1.0", "starlette>=1.3.1,<2", "uvicorn[standard]>=0.27,<1.0"]
# Microsoft Entra ID auth for the azure provider (azure_auth="entra"). The
# async credentials need aiohttp as their HTTP transport.
azure = ["azure-identity>=1.25.3,<2", "aiohttp>=3.14.4,<4"]
# Claude on Google Vertex AI (the vertex provider): the SDK's Vertex extra
# (google-auth with its requests transport). google-auth 2.29.0 added the
# custom subject-token suppliers used for Workload Identity Federation from an
# Azure managed identity, which additionally needs the `azure` extra.
vertex = ["anthropic[vertex]>=1.5.0,<2", "google-auth[requests]>=2.29.0,<3"]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "hypothesis>=6,<7",
  "ruff>=0.8,<1",
  "pyright>=1.1.400,<2",
  "build>=1.2,<2",
  "hatchling>=1.25,<2",
  # Only for starlette's TestClient in tests/test_service.py — the provider
  # SDKs themselves use httpx2 since anthropic 1.0 / openai 3.0.
  "httpx>=0.27,<1.0",
  "fastapi>=0.133,<1.0",
  "starlette>=1.3.1,<2",
  "uvicorn[standard]>=0.27,<1.0",
  # Supply-chain tooling used by scripts/audit.sh and scripts/sbom.sh.
  "pip-audit>=2.7,<3",
  "cyclonedx-bom>=7,<9",
]

[project.scripts]
llm-gateway = "llm_gateway.service.main:main"

# The sdist ships source, tests and docs only: no infra/ (even SOPS ciphertext),
# CI workflows, Dockerfile or .env.example.
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/CHANGELOG.md", "/MIGRATION.md", "/SECURITY.md", "/CONTRIBUTING.md", "/LICENSE", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["llm_gateway"]
branch = true

[tool.coverage.report]
# Achieved 98.82% (statements + branches) in 0.42.1; floor is that rounded down to 0.1.
fail_under = 98.8

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
# Strict for the modules that build provider payloads; the rest stays standard.
strict = [
  "src/llm_gateway/providers",
  "src/llm_gateway/structured.py",
  "src/llm_gateway/router.py",
]
# Provider modules deliberately share module-level internals (client caches,
# credential helpers) with their thin siblings and with tests.
reportPrivateUsage = "none"
