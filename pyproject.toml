[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-gateway"
version = "0.8.0"
description = "Self-hosted multi-provider LLM gateway (Anthropic, Claude on Google Vertex AI, Azure AI Foundry, Groq, OpenAI, Mistral, OpenRouter, and any OpenAI-compatible host): fallback chain, circuit breaker, PII-masked tracing — as a library or an OpenAI-compatible HTTP service."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Maciej Adamczyk" }]
dependencies = [
  "anthropic>=1.5.0,<2",
  "openai>=3.13.0,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[project.optional-dependencies]
service = ["fastapi>=0.110,<1.0", "uvicorn[standard]>=0.27,<1.0"]
# Microsoft Entra ID auth for the azure provider (azure_auth="entra"). The
# async credentials need aiohttp as their HTTP transport.
azure = ["azure-identity>=1.25.3", "aiohttp>=3.14"]
# Claude on Google Vertex AI (the vertex provider): the SDK's Vertex extra
# (google-auth with its requests transport). google-auth 2.29.0 added the
# custom subject-token suppliers used for Workload Identity Federation from an
# Azure managed identity, which additionally needs the `azure` extra.
vertex = ["anthropic[vertex]>=1.5.0,<2", "google-auth[requests]>=2.29.0,<3"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  # Only for starlette's TestClient in tests/test_service.py — the provider
  # SDKs themselves use httpx2 since anthropic 1.0 / openai 3.0.
  "httpx>=0.27,<1.0",
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
]

[project.scripts]
llm-gateway = "llm_gateway.service.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
