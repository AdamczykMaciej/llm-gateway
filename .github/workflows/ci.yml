name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (dev extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Run tests
        run: pytest -q

      - name: Terraform format check
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - run: terraform fmt -check -recursive infra/terraform

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      id-token: write # required to mint the WIF OIDC token — no stored GCP key

    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_sops_admin_member: ${{ vars.SOPS_ADMIN_MEMBER }}
      REGISTRY: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/llm-gateway

    steps:
      - uses: actions/checkout@v4

      # Workload Identity Federation — see infra/terraform/wif.tf. No
      # long-lived key stored in GitHub; this exchanges the job's own OIDC
      # token for short-lived GCP credentials scoped to this repo. These two
      # values come from `terraform output` after the one-time local WIF
      # bootstrap (see infra/README.md) — set as repo Variables.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init

      # Everything except Cloud Run first — the image doesn't exist yet.
      - name: Apply infra (APIs, Artifact Registry, secrets, IAM)
        working-directory: infra/terraform
        run: |
          terraform apply -auto-approve \
            -target=google_project_service.apis \
            -target=google_artifact_registry_repository.images \
            -target=google_service_account.runtime \
            -target=google_secret_manager_secret.gateway \
            -target=google_secret_manager_secret_version.gateway \
            -target=google_secret_manager_secret_iam_member.gateway_access

      - name: Build and push image
        run: |
          docker build -t "$REGISTRY/gateway:${{ github.sha }}" -t "$REGISTRY/gateway:latest" .
          docker push "$REGISTRY/gateway:${{ github.sha }}"
          docker push "$REGISTRY/gateway:latest"

      - name: Deploy Cloud Run
        working-directory: infra/terraform
        run: |
          terraform apply -auto-approve \
            -var="gateway_image=$REGISTRY/gateway:${{ github.sha }}"

      - name: Show gateway URL
        working-directory: infra/terraform
        run: terraform output -raw gateway_url
